name: CI & Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-consistency:
    name: Version & Metadata Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Version Synchronization
        run: |
          VERSION_FILE=$(cat VERSION | tr -d '[:space:]')
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "VERSION file: $VERSION_FILE"
          echo "package.json: $PKG_VERSION"

          if [ "$VERSION_FILE" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: VERSION ($VERSION_FILE) != package.json ($PKG_VERSION)"
            exit 1
          fi

          if ! grep -q "APP_VERSION = '$VERSION_FILE'" src/constants/version.ts; then
            echo "::error::src/constants/version.ts does not match canonical version $VERSION_FILE"
            exit 1
          fi

          if ! grep -q "version = \"$VERSION_FILE\"" pyproject.toml; then
            echo "::error::pyproject.toml does not match canonical version $VERSION_FILE"
            exit 1
          fi

          if ! grep -q "VERSION: str = \"$VERSION_FILE\"" utils/constants.py; then
            echo "::error::utils/constants.py does not match canonical version $VERSION_FILE"
            exit 1
          fi

          echo "All version declarations synchronized successfully at v$VERSION_FILE."

  web-lint:
    name: Web Linter & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Code Formatting
        run: npm run format:check

  web-test:
    name: Web Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests & Coverage
        run: npm run coverage

  web-build:
    name: Web Build & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: omnicalc-pro:test

      - name: Run Container Smoke Test
        run: |
          docker run -d --name omnicalc-smoke -p 3000:3000 omnicalc-pro:test
          sleep 3
          curl -f http://localhost:3000/ || (docker logs omnicalc-smoke && exit 1)
          docker stop omnicalc-smoke

  python-lint:
    name: Python Linting & Type Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest ruff mypy
          pip install -e . --no-deps

      - name: Lint with Ruff
        run: ruff check core utils ui tests || true

      - name: Static Type Check with MyPy
        run: mypy --config-file pyproject.toml core utils ui || true

  python-test:
    name: Python Engine Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    env:
      QT_QPA_PLATFORM: offscreen
      QT_LOGGING_RULES: '*.debug=false;qt.qpa.*=false'
      MPLBACKEND: Agg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest
          pip install -e . --no-deps

      - name: Run Pytest Suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m pytest tests/ -v --tb=short

      - name: Run Pytest Suite (Windows/macOS Headless)
        if: runner.os != 'Linux'
        run: |
          python -m pytest tests/ -v --tb=short

  ci-gate:
    name: CI Pipeline Status Check
    needs:
      [version-consistency, web-lint, web-test, web-build, docker-build, python-lint, python-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status of All CI Jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI pipeline failed. Check individual job logs for details."
            exit 1
          fi
          echo "All CI pipeline checks passed successfully."
