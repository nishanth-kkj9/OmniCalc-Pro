name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  web-release:
    name: Build & Release Web Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web
        run: |
          npm ci
          npm run build
          tar -czvf omnicalc-pro-web.tar.gz dist/
          sha256sum omnicalc-pro-web.tar.gz > SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omnicalc-pro-web.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true

  desktop-release-windows:
    name: Build & Release Windows Desktop Binary
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --windowed --name=OmniCalc-Pro --add-data "assets;assets" main.py

      - name: Attach Windows Executable to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OmniCalc-Pro.exe
          draft: false
          prerelease: false
