name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  web-release:
    name: Build & Release Web Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Node.js 20.x
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web
        run: |
          npm ci
          npm run build
          tar -czvf omnicalc-pro-web.tar.gz dist/
          sha256sum omnicalc-pro-web.tar.gz > SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@d99959b9fda58353af1b915bde11b78ac553d1b4 # v2.0.7
        with:
          files: |
            omnicalc-pro-web.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true

  desktop-release-windows:
    name: Build & Release Windows Desktop Binary
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9e0d20f1dafcf9bc8b08cad3170cc3fc # v5.1.1
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --windowed --name=OmniCalc-Pro --add-data "assets;assets" main.py

      - name: Attach Windows Executable to Release
        uses: softprops/action-gh-release@d99959b9fda58353af1b915bde11b78ac553d1b4 # v2.0.7
        with:
          files: dist/OmniCalc-Pro.exe
          draft: false
          prerelease: false
