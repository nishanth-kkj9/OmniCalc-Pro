name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web
        run: |
          npm ci
          npm run build
          tar -czvf omnicalc-pro-web.tar.gz dist/
          sha256sum omnicalc-pro-web.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87b0b01613b49e39ea74c # v2.2.1
        with:
          files: |
            omnicalc-pro-web.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
