[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicalc-pro"
version = "2.1.0"
description = "An all-in-one advanced professional calculator for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OmniCalc Pro Team"}
]

dependencies = [
    "PySide6>=6.6,<6.12",
    "numpy>=1.26,<2.3",
    "sympy>=1.13,<1.15",
    "matplotlib>=3.8,<3.11",
    "pyperclip>=1.8.2,<1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools]
packages = ["core", "ui", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "W605"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["PySide6.*", "matplotlib.*", "numpy.*", "sympy.*", "pyperclip.*", "ctypes.wintypes.*"]
ignore_missing_imports = true
follow_imports = "skip"


