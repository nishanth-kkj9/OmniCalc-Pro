[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicalc-pro"
version = "2.1.0"
description = "An all-in-one advanced professional calculator for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OmniCalc Pro Team"}
]

dependencies = [
    "PySide6>=6.6.0",
    "numpy>=1.24.0",
    "sympy>=1.12.0",
    "matplotlib>=3.7.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401", "F841", "E722", "W605", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = false
check_untyped_defs = true
disallow_untyped_defs = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["PySide6.*", "matplotlib.*", "numpy.*", "sympy.*", "pyperclip.*"]
ignore_missing_imports = true

